<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>An Important Question 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080510;
    --rose: #e8607a;
    --gold: #f0c060;
    --lavender: #c084d4;
    --text: #f7f0f2;
    --muted: #6b5a6e;
    --card: rgba(20,10,28,0.95);
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height:100vh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'DM Mono',monospace;
    overflow:hidden;
    cursor:default;
  }

  /* Stars */
  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star {
    position:absolute; border-radius:50%; background:#fff;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100%{opacity:0.1;transform:scale(1);}
    50%{opacity:0.7;transform:scale(1.4);}
  }

  /* Orbs */
  .orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; }
  .o1{width:500px;height:500px;top:-150px;left:-150px;background:var(--lavender);opacity:0.12;}
  .o2{width:400px;height:400px;bottom:-120px;right:-100px;background:var(--rose);opacity:0.12;}
  .o3{width:250px;height:250px;top:40%;left:45%;background:var(--gold);opacity:0.06;}

  /* Petals */
  .petal { position:fixed; pointer-events:none; z-index:0; opacity:0; animation:petalFall linear infinite; }
  @keyframes petalFall {
    0%{transform:translateY(-40px) rotate(0deg);opacity:0;}
    10%{opacity:0.4;} 90%{opacity:0.2;}
    100%{transform:translateY(110vh) rotate(360deg) translateX(60px);opacity:0;}
  }

  /* ── Envelope intro ── */
  #envelope-scene {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    transition:opacity 0.6s;
  }
  .env-wrap { position:relative; width:240px; height:160px; cursor:pointer; }
  .env-body {
    width:240px; height:160px;
    background:linear-gradient(160deg,#1e0e2e,#2a1040);
    border-radius:8px;
    border:1px solid rgba(232,96,122,0.3);
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    position:absolute; bottom:0;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:18px;
  }
  .env-flap {
    position:absolute;
    top:0; left:0;
    width:0; height:0;
    border-left:120px solid transparent;
    border-right:120px solid transparent;
    border-top:80px solid #2e1050;
    transform-origin:top center;
    transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);
    z-index:2;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  }
  .env-flap.open { transform:rotateX(180deg); }
  .env-letter {
    position:absolute;
    bottom:20px; left:50%; transform:translateX(-50%);
    width:180px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:6px; padding:10px;
    font-size:10px; color:rgba(247,240,242,0.6);
    letter-spacing:0.1em; text-align:center;
    transition:transform 0.7s cubic-bezier(0.34,1.4,0.64,1) 0.3s, opacity 0.4s 0.3s;
    opacity:0;
  }
  .env-letter.rising { transform:translateX(-50%) translateY(-90px); opacity:1; }
  .env-hint {
    position:absolute; bottom:-36px; left:50%; transform:translateX(-50%);
    font-size:9px; color:var(--muted); letter-spacing:0.2em; white-space:nowrap;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }

  /* ── Main card ── */
  .card {
    position:relative; z-index:10;
    background:var(--card);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:28px;
    padding:52px 48px 44px;
    width:min(520px,94vw);
    text-align:center;
    backdrop-filter:blur(20px);
    box-shadow:0 50px 100px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.05);
    opacity:0; transform:scale(0.94);
    transition:opacity 0.6s, transform 0.6s cubic-bezier(0.34,1.2,0.64,1);
  }
  .card.visible { opacity:1; transform:scale(1); }
  .card::before {
    content:''; position:absolute; inset:-1px; border-radius:28px;
    background:linear-gradient(135deg,rgba(232,96,122,0.3),transparent 40%,rgba(192,132,212,0.2) 80%,transparent);
    z-index:-1; pointer-events:none;
  }

  .tag {
    display:inline-block; font-size:9px; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--muted); border:1px solid rgba(255,255,255,0.08);
    padding:5px 14px; border-radius:20px; margin-bottom:28px;
  }

  .envelope-icon {
    font-size:48px; margin-bottom:18px; display:block;
    animation:floatBob 3s ease-in-out infinite;
  }
  @keyframes floatBob {
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-10px) rotate(3deg);}
  }

  h1 {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(26px,4.5vw,36px); font-weight:300;
    color:var(--text); line-height:1.3; margin-bottom:14px;
    min-height:2.6em;
  }
  h1 em { font-style:italic; color:var(--rose); }

  .subtext {
    font-size:11px; color:var(--muted); letter-spacing:0.1em;
    line-height:1.9; margin-bottom:8px;
    max-width:360px; margin-left:auto; margin-right:auto;
    min-height:5em;
  }
  .subtext span { color:rgba(247,240,242,0.5); }

  /* Typewriter cursor */
  .cursor {
    display:inline-block; width:2px; height:1em;
    background:var(--rose); vertical-align:middle;
    animation:blink 0.9s step-end infinite; margin-left:2px;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

  /* 8PM Facetime badge */
  .facetime-badge {
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(232,96,122,0.1);
    border:1px solid rgba(232,96,122,0.25);
    border-radius:20px; padding:8px 18px;
    font-size:10px; color:var(--rose); letter-spacing:0.15em;
    margin-bottom:28px;
    opacity:0; transform:translateY(8px);
    transition:opacity 0.5s, transform 0.5s;
  }
  .facetime-badge.show { opacity:1; transform:translateY(0); }
  .facetime-badge .dot {
    width:6px; height:6px; border-radius:50%;
    background:var(--rose);
    animation:livePulse 1.2s ease-in-out infinite;
  }
  @keyframes livePulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.5);opacity:0.5;} }

  .divider {
    width:60px; height:1px;
    background:linear-gradient(90deg,transparent,var(--rose),var(--gold),transparent);
    margin:0 auto 28px;
  }

  /* Options */
  .options { display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .option {
    position:relative; background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07); border-radius:14px;
    padding:15px 20px 15px 52px; text-align:left; cursor:pointer;
    transition:all 0.25s; overflow:hidden;
  }
  .option:hover { background:rgba(232,96,122,0.08); border-color:rgba(232,96,122,0.3); transform:translateX(4px); }
  .option:hover .checkbox { border-color:var(--rose); }
  .option::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,rgba(232,96,122,0.05),transparent);
    opacity:0; transition:opacity 0.25s;
  }
  .option:hover::after { opacity:1; }

  .checkbox {
    position:absolute; left:18px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border:1.5px solid rgba(255,255,255,0.15);
    border-radius:6px; display:flex; align-items:center; justify-content:center;
    transition:all 0.25s; font-size:12px;
  }
  .option-label {
    font-family:'Cormorant Garamond',serif; font-size:18px;
    font-weight:400; color:var(--text); display:block; line-height:1.3;
  }
  .option-sub { font-size:9px; color:var(--muted); letter-spacing:0.15em; margin-top:3px; display:block; }

  /* ── Floating No button ── */
  #noOption {
    position:fixed; z-index:20;
    width:220px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px; padding:15px 20px 15px 52px;
    text-align:left; cursor:not-allowed;
    transition:opacity 0.3s;
    opacity:0.4;
  }
  #noOption:hover { background:rgba(255,255,255,0.02) !important; transform:none !important; }

  /* Tooltip */
  .no-tooltip {
    position:fixed; z-index:30;
    background:rgba(20,10,28,0.95);
    border:1px solid rgba(232,96,122,0.3);
    border-radius:10px; padding:7px 14px;
    font-size:10px; color:var(--rose); letter-spacing:0.1em;
    pointer-events:none;
    opacity:0; transition:opacity 0.2s;
    white-space:nowrap;
  }
  .no-tooltip.show { opacity:1; }

  /* Result */
  .result { display:none; animation:resultIn 0.6s cubic-bezier(0.34,1.4,0.64,1) both; }
  @keyframes resultIn { from{opacity:0;transform:scale(0.8);} to{opacity:1;transform:scale(1);} }
  .result-emoji { font-size:64px; margin-bottom:18px; display:block; }
  .result-title {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(26px,4.5vw,36px); font-weight:300;
    color:var(--text); margin-bottom:12px;
  }
  .result-title em { color:var(--rose); font-style:italic; }
  .result-sub { font-size:10px; color:var(--muted); letter-spacing:0.18em; line-height:2.2; }

  /* Music btn */
  #musicBtn {
    position:fixed; bottom:24px; right:24px; z-index:40;
    background:rgba(20,10,28,0.8); border:1px solid rgba(255,255,255,0.1);
    color:var(--muted); font-family:'DM Mono',monospace; font-size:10px;
    padding:8px 16px; border-radius:20px; cursor:pointer;
    letter-spacing:0.12em; transition:all 0.2s; backdrop-filter:blur(10px);
  }
  #musicBtn:hover { border-color:var(--rose); color:var(--rose); }
  #musicBtn.playing { border-color:var(--rose); color:var(--rose); }

  /* Canvas */
  #fireworks { position:fixed; inset:0; pointer-events:none; z-index:100; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div id="petals"></div>
<canvas id="fireworks"></canvas>

<!-- Floating No tooltip -->
<div class="no-tooltip" id="noTooltip">nice try 🤷🏻‍♂️</div>

<!-- Floating No button (outside card, positioned by JS) -->
<div id="noOption">
  <div class="checkbox" style="position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:1.5px solid rgba(255,255,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;">☐</div>
  <span class="option-label" style="font-family:'Cormorant Garamond',serif;font-size:18px;color:rgba(247,240,242,0.5);display:block;">No 🙅🏻‍♀️</span>
  <span class="option-sub" style="font-size:9px;color:#3a2d45;letter-spacing:0.15em;margin-top:3px;display:block;">not an option bestie 😂</span>
</div>

<!-- Envelope intro -->
<div id="envelope-scene">
  <div class="env-wrap" id="envWrap" onclick="openEnvelope()">
    <div class="env-body">
      <div class="env-letter" id="envLetter">💌 a message for shosho</div>
    </div>
    <div class="env-flap" id="envFlap"></div>
    <div class="env-hint" id="envHint">tap to open ✦</div>
  </div>
</div>

<!-- Main card -->
<div class="card" id="mainCard">
  <div id="question">
    <div class="tag">✦ an important question ✦</div>
    <span class="envelope-icon">💌</span>
    <h1 id="mainTitle"><span id="titleText"></span><span class="cursor" id="titleCursor"></span></h1>
    <p class="subtext" id="subtext"><span id="subtextContent"></span><span class="cursor" id="subtextCursor" style="display:none"></span></p>
    <div class="facetime-badge" id="ftBadge">
      <span class="dot"></span>
      8PM FaceTime — I'll come pick you up! 🚗💨
    </div>
    <div class="divider"></div>
    <div class="options">
      <div class="option" onclick="choose(this,1)">
        <div class="checkbox">☐</div>
        <span class="option-label">Yes! 🥰</span>
        <span class="option-sub">the correct answer</span>
      </div>
      <div class="option" onclick="choose(this,2)">
        <div class="checkbox">☐</div>
        <span class="option-label">Yes! 😊</span>
        <span class="option-sub">also the correct answer</span>
      </div>
      <div class="option" onclick="choose(this,3)">
        <div class="checkbox">☐</div>
        <span class="option-label">All of the above ✅</span>
        <span class="option-sub">the most correct answer</span>
      </div>
    </div>
  </div>
  <div class="result" id="result">
    <span class="result-emoji" id="resultEmoji"></span>
    <h2 class="result-title" id="resultTitle"></h2>
    <p class="result-sub" id="resultSub"></p>
  </div>
</div>

<!-- Music button -->
<button id="musicBtn" onclick="toggleMusic()">♪ MUSIC OFF</button>

<!-- YouTube iframe hidden -->
<iframe id="ytPlayer" width="0" height="0"
  src="https://www.youtube.com/embed/9AXWuVmr6d4?enablejsapi=1&autoplay=0&loop=1&playlist=9AXWuVmr6d4"
  allow="autoplay" style="position:fixed;left:-9999px;top:-9999px;"></iframe>

<script>
// ── Stars ──
const starsEl=document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div'); s.className='star';
  const sz=Math.random()*2+0.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
  starsEl.appendChild(s);
}

// ── Petals ──
const petalsEl=document.getElementById('petals');
['🌸','🌹','✨','💕','🌷','💗'].forEach((c,i)=>{
  for(let j=0;j<2;j++){
    const p=document.createElement('div'); p.className='petal'; p.textContent=c;
    p.style.cssText=`left:${Math.random()*100}vw;animation-duration:${10+Math.random()*14}s;animation-delay:${Math.random()*12}s;font-size:${10+Math.random()*10}px`;
    petalsEl.appendChild(p);
  }
});

// ── Music ──
let musicOn=false;
const ytPlayer=document.getElementById('ytPlayer');
function toggleMusic(){
  musicOn=!musicOn;
  const btn=document.getElementById('musicBtn');
  if(musicOn){
    ytPlayer.src='https://www.youtube.com/embed/9AXWuVmr6d4?enablejsapi=1&autoplay=1&loop=1&playlist=9AXWuVmr6d4';
    btn.textContent='♪ MUSIC ON'; btn.classList.add('playing');
  } else {
    ytPlayer.src='';
    btn.textContent='♪ MUSIC OFF'; btn.classList.remove('playing');
  }
}

// ── Envelope ──
let envelopeOpened=false;
function openEnvelope(){
  if(envelopeOpened) return;
  envelopeOpened=true;
  document.getElementById('envHint').style.opacity='0';
  document.getElementById('envFlap').classList.add('open');
  setTimeout(()=>{ document.getElementById('envLetter').classList.add('rising'); },400);
  setTimeout(()=>{
    const scene=document.getElementById('envelope-scene');
    scene.style.opacity='0';
    scene.style.pointerEvents='none';
  },1400);
  setTimeout(()=>{
    document.getElementById('envelope-scene').style.display='none';
    document.getElementById('mainCard').classList.add('visible');
    positionNoButton();
    startTypewriter();
  },2000);
}

// ── Typewriter ──
const titleStr = 'Will you go on a virtual date with me?';
const subtextLines = [
  'I know we can\'t physically be there —',
  'but a virtual one is the one we can have right now.',
  'So… what do you say, Shosho? 🥹'
];

function typewrite(element, text, speed, onDone){
  let i=0;
  element.textContent='';
  const interval=setInterval(()=>{
    element.textContent+=text[i];
    i++;
    if(i>=text.length){ clearInterval(interval); if(onDone) onDone(); }
  }, speed);
}

function startTypewriter(){
  const titleEl=document.getElementById('titleText');
  const titleCursor=document.getElementById('titleCursor');
  const subtextEl=document.getElementById('subtextContent');
  const subtextCursor=document.getElementById('subtextCursor');

  // Type title
  typewrite(titleEl, titleStr, 45, ()=>{
    // remove title cursor, start subtext
    titleCursor.style.display='none';
    subtextCursor.style.display='inline-block';
    const fullSub=subtextLines.join('\n');
    let i=0; subtextEl.innerHTML='';
    const interval=setInterval(()=>{
      if(fullSub[i]==='\n') subtextEl.innerHTML+='<br>';
      else subtextEl.innerHTML+=fullSub[i];
      i++;
      if(i>=fullSub.length){
        clearInterval(interval);
        subtextCursor.style.display='none';
        // show FaceTime badge
        setTimeout(()=>document.getElementById('ftBadge').classList.add('show'),300);
      }
    },28);
  });
}

// ── No button floating ──
const noBtn=document.getElementById('noOption');
const tooltip=document.getElementById('noTooltip');
let noBtnPlaced=false;

function positionNoButton(){
  const vw=window.innerWidth, vh=window.innerHeight;
  noBtn.style.left=(vw/2-110)+'px';
  noBtn.style.top=(vh-120)+'px';
  noBtnPlaced=true;
}

let isMoving=false;
noBtn.addEventListener('mouseenter',()=>{
  if(isMoving) return;
  isMoving=true;
  // show tooltip near cursor
  const rect=noBtn.getBoundingClientRect();
  tooltip.style.left=(rect.left+30)+'px';
  tooltip.style.top=(rect.top-36)+'px';
  tooltip.classList.add('show');
  setTimeout(()=>tooltip.classList.remove('show'),900);
  // fly to random spot
  const vw=window.innerWidth-240, vh=window.innerHeight-80;
  const nx=Math.max(20,Math.min(vw, Math.random()*vw));
  const ny=Math.max(20,Math.min(vh, Math.random()*vh));
  noBtn.style.transition='left 0.5s cubic-bezier(0.34,1.4,0.64,1), top 0.5s cubic-bezier(0.34,1.4,0.64,1), opacity 0.3s';
  noBtn.style.opacity='0.2';
  noBtn.style.left=nx+'px';
  noBtn.style.top=ny+'px';
  setTimeout(()=>{ noBtn.style.opacity='0.4'; isMoving=false; },600);
});

// mobile: move on touch
noBtn.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  if(isMoving) return;
  isMoving=true;
  const vw=window.innerWidth-240, vh=window.innerHeight-80;
  const nx=Math.max(20,Math.min(vw,Math.random()*vw));
  const ny=Math.max(20,Math.min(vh,Math.random()*vh));
  noBtn.style.transition='left 0.5s cubic-bezier(0.34,1.4,0.64,1), top 0.5s cubic-bezier(0.34,1.4,0.64,1)';
  noBtn.style.left=nx+'px'; noBtn.style.top=ny+'px';
  setTimeout(()=>isMoving=false,600);
});

// ── Choose ──
const results=[
  {emoji:'🥳💕',title:'She said <em>Yes!</em>',sub:'I knew it all along 🤷🏻‍♂️\n8PM FaceTime — don\'t be late, Shosho 💕'},
  {emoji:'🌹😍',title:'<em>Yes!</em> She said it!',sub:'Smart girl, great choice.\nSee you at 8PM — Jeddah → Riyadh 💌'},
  {emoji:'🎉❤️',title:'All of the above!',sub:'The most correct answer — just like you.\nJeddah → Riyadh 💌🥹'}
];

function choose(el, idx){
  el.querySelector('.checkbox').innerHTML='✓';
  el.querySelector('.checkbox').style.cssText='position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:1.5px solid #e8607a;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(232,96,122,0.15);color:#e8607a';
  el.style.background='rgba(232,96,122,0.1)';
  el.style.borderColor='rgba(232,96,122,0.4)';
  noBtn.style.display='none';
  setTimeout(()=>{
    const r=results[idx-1];
    document.getElementById('resultEmoji').textContent=r.emoji;
    document.getElementById('resultTitle').innerHTML=r.title;
    document.getElementById('resultSub').innerHTML=r.sub.replace(/\n/g,'<br>');
    document.getElementById('question').style.display='none';
    document.getElementById('result').style.display='block';
    launchFireworks();
  },600);
}

// ── Fireworks ──
function launchFireworks(){
  const canvas=document.getElementById('fireworks');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const particles=[];
  const colors=['#e8607a','#f0c060','#c084d4','#ff9fb2','#ffffff','#ffcce0'];

  function createBurst(x,y){
    for(let i=0;i<60;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=2+Math.random()*6;
      particles.push({
        x,y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        color:colors[Math.floor(Math.random()*colors.length)],
        alpha:1, r:2+Math.random()*3,
        gravity:0.08, decay:0.013+Math.random()*0.008
      });
    }
  }

  let bursts=0;
  function nextBurst(){
    if(bursts>=6) return;
    createBurst(Math.random()*canvas.width, Math.random()*canvas.height*0.7);
    bursts++;
    if(bursts<6) setTimeout(nextBurst, 380);
  }
  nextBurst();

  function animate(){
    ctx.fillStyle='rgba(8,5,16,0.18)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    particles.forEach((p,i)=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity;
      p.alpha-=p.decay; p.vx*=0.99; p.vy*=0.99;
      if(p.alpha<=0){ particles.splice(i,1); return; }
      ctx.save();
      ctx.globalAlpha=p.alpha;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color;
      ctx.fill();
      ctx.restore();
    });
    if(particles.length>0) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}
</script>
</body>
