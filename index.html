<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incoming call</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;background:#111;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .screen{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .avatar{width:110px;height:110px;border-radius:50%;background:#2b2b2b;display:flex;align-items:center;justify-content:center;font-size:3.4rem;animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}100%{box-shadow:0 0 0 34px rgba(52,199,89,0)}}
  .label{opacity:.6;font-size:.95rem}
  .name{font-size:2rem;font-weight:700}
  .btns{display:flex;gap:70px;margin-top:70px}
  .btn{width:72px;height:72px;border-radius:50%;border:0;font-size:1.8rem;cursor:pointer;color:#fff}
  .red{background:#ff3b30}.green{background:#34c759;animation:ring 1s infinite}
  @keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
  .hidden{display:none!important}
  .line{font-size:1.5rem;line-height:1.8;min-height:3.6em;margin-top:30px;animation:fade .8s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .banner{display:flex;align-items:center;gap:12px;width:100%;margin-top:30px;background:#222;border-radius:20px;padding:12px 14px;animation:slide .6s}
  @keyframes slide{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .bav{width:46px;height:46px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
  .bt{flex:1;text-align:left}
  .bn{font-size:1.2rem;font-weight:700}
  .btn.sm{width:46px;height:46px;font-size:1.1rem;animation:none}
  .banner .green{animation:ring 1s infinite}
</style>
</head>
<body>
<div class="screen" id="ring">
  <div class="label" id="lbl">Incoming call...</div>
  <div class="avatar">👤</div>
  <div class="name">Wala Hamo</div>
  <div class="label" id="sub">mobile</div>
  <div class="btns">
    <button class="btn red" id="no">✕</button>
    <button class="btn green" id="yes">✆</button>
  </div>
</div>

<div class="screen hidden" id="call">
  <div class="label" id="timer">00:00</div>
  <div class="avatar" style="animation:none">👤</div>
  <div class="name">Wala Hamo</div>
  <div class="line" id="line"></div>
  <div class="banner hidden" id="end">
    <div class="bav">👤</div>
    <div class="bt"><div class="label">Incoming call</div><div class="bn">عطارد</div></div>
    <button class="btn red sm">✕</button>
    <button class="btn green sm">✆</button>
  </div>
</div>

<audio id="song" src="hamo.mp3" preload="auto"></audio>

<script>
const $=id=>document.getElementById(id);
let declines=0;
const declineMsgs=[
  ["Wala Hamo is calling again...","missed call (1)"],
  ["He's not going to stop...","missed call (2)"],
  ["Just pick up, have mercy","missed call (3)"]
];
$('no').onclick=()=>{
  const m=declineMsgs[Math.min(declines,2)]; declines++;
  $('lbl').textContent=m[0]; $('sub').textContent=m[1];
  if(declines>=3){ $('no').style.opacity='.25'; $('no').style.pointerEvents='none'; }
};
const lines=[
  "Hello?",
  "Wala Hamo... is that you?",
  "I only called for one reason.",
  "الشمس",
  "That's it. That's the whole call."
];
$('yes').onclick=()=>{
  try{ const a=$('song'); a.currentTime=0; a.play().catch(()=>{}); }catch(e){}
  $('ring').classList.add('hidden'); $('call').classList.remove('hidden');
  let s=0; setInterval(()=>{s++;$('timer').textContent='00:'+String(s).padStart(2,'0')},1000);
  lines.forEach((t,i)=>setTimeout(()=>{
    const el=$('line'); el.style.animation='none'; el.offsetHeight; el.style.animation='';
    el.textContent=t;
    if(i===lines.length-1) setTimeout(()=>$('end').classList.remove('hidden'),1500);
  }, 1200+i*2400));
};
</script>
</body>
</html>
